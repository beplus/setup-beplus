# A beplus docs site, built and published to GitHub Pages, once.
# ---------------------------------------------------------------
# beplus/uix (`portal.yml`) and beplus/cli_v2 (`docs.yml`) each carried the same pipeline for
# their RR7 docs portals: ask Pages where the site lives, install, build, upload, deploy — and on a
# pull request, build and stop. Both portals are now `@beplus/docs-site` (beplus/docs), so the
# pipeline lives here, and a repository's docs workflow is a caller:
#
#   jobs:
#     docs:
#       uses: beplus/setup-beplus/.github/workflows/docs-pages.yml@v2
#       permissions:
#         contents: read
#         pages: write
#         id-token: write
#       secrets: inherit
#       with:
#         working-directory: packages/sites/portal
#         prebuild: node common/scripts/install-run-rush.js build --to @beplus/cli
#         publish-branch: prod
#
# The site is built by the package's own `build` script (`beplus-docs build`), which checks the
# bundle and fails on an unreachable page or a broken link before anything is published.
#
# The project switcher: the brand bar of every beplus docs site switches between all of them, and
# GitHub keeps that list — every repository in the organisation whose `beplus-docs-project` custom
# property is set (the name the switcher shows), at the address its Pages site is served from. The
# job asks for it with the organisation's `beplus` GitHub App (`BE_GITHUB_APP_ID`, a variable, and
# `BE_GITHUB_APP_PRIVATE_KEY`, a secret; Metadata, Pages and custom properties read) and hands it to
# the build as `DOCS_PROJECTS`. Without the App — a fork's pull request — the site shows the engine's
# own list; a run whose own repository is not in GitHub's says so in its summary.
#
# The registry: `@beplus/docs-site` draws with @beplus/uix and FontAwesome Pro, installed from
# npm.beplus.cloud. The job authenticates it as every other shared workflow here does — the
# `cli` action's `beplus npm auth`, from `BE_NPM_TARGET` and `BE_NPM_TOKEN` — which writes the
# token and the scopes (`@beplus`, `@fortawesome`, …) to ~/.npmrc. `BE_NPM_TOKEN` is read from the
# caller's secrets (`secrets: inherit`), which reach this job only if it is a repository or
# organisation secret — or an environment secret of the environment named in `environment`.

name: Docs to GitHub Pages

on:
  workflow_call:
    inputs:
      working-directory:
        description: "The package holding docs.config.ts, relative to the repository root."
        required: true
        type: string
      prebuild:
        description: "A command run from the repository root after install and before the build — building what the site reads (a CLI, the workspace packages the site depends on)."
        required: false
        type: string
        default: ""
      test:
        description: "A command run in the working directory before the build."
        required: false
        type: string
        default: ""
      build:
        description: "The build command, run in the working directory."
        required: false
        type: string
        default: "npm run build"
      output:
        description: "What the build writes for Pages to serve, relative to the working directory."
        required: false
        type: string
        default: "build/client"
      publish-branch:
        description: "Publish only from this branch. Empty publishes from whatever the caller's triggers run on (never from a pull request)."
        required: false
        type: string
        default: ""
      environment:
        description: "The environment the build job runs in, when BE_NPM_TOKEN is an environment secret (uix's is on `dev`)."
        required: false
        type: string
        default: ""
      node-version:
        description: "Node.js version."
        required: false
        type: string
        default: "22.14"
      title:
        description: "What the step summary calls the site."
        required: false
        type: string
        default: "Docs"

permissions:
  contents: read

# One deployment at a time, and never cancel one half-done: a partly uploaded site is a broken one.
# A pull request's build deploys nothing, so a newer push to it replaces the one in flight.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docs-pages-{0}', github.ref) || format('docs-pages-{0}', github.repository) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the docs site
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    # `pages: read` is for asking Pages where the site will be served, below.
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.publish.outputs.publish }}

    steps:
      - uses: actions/checkout@v6

      - name: Decide whether this run publishes
        id: publish
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          ONLY: ${{ inputs.publish-branch }}
        run: |
          if [ "$EVENT" != "pull_request" ] && { [ -z "$ONLY" ] || [ "$BRANCH" = "$ONLY" ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Where the site will be served, asked of Pages rather than guessed. A private site is served
      # from a unique subdomain of its own, at the root; a public project site from /<repository>/; a
      # custom domain at the root. Every link and every asset the build writes starts with this path,
      # so guessing wrong serves a page whose stylesheet, scripts and links all 404. A run that does
      # not publish cannot ask, and builds at the root.
      - name: Ask Pages where the site lives
        id: pages
        if: steps.publish.outputs.publish == 'true'
        uses: actions/configure-pages@v5

      # The projects the brand bar switches between, asked of GitHub rather than kept in the engine:
      # a new portal is then in this site's switcher the next time this site is built, and one that
      # moves to its own domain moves here with it. This run's own token reads only this repository,
      # so the organisation's App reads the others; a run without it keeps the engine's own list.
      - name: Check for the App that reads the organisation
        id: app
        env:
          APP_ID: ${{ vars.BE_GITHUB_APP_ID }}
          APP_KEY: ${{ secrets.BE_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Project switcher::BE_GITHUB_APP_ID or BE_GITHUB_APP_PRIVATE_KEY is not set here, so the switcher lists the engine's own projects."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get a token that reads the organisation
        id: app-token
        if: steps.app.outputs.ready == 'true'
        # A token the App cannot have is a switcher out of date, not a site that cannot be published.
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.BE_GITHUB_APP_ID }}
          private-key: ${{ secrets.BE_GITHUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-metadata: read
          permission-pages: read
          permission-organization-custom-properties: read

      - name: Ask GitHub which projects publish a portal
        id: projects
        if: steps.app-token.outputs.token != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ORG: ${{ github.repository_owner }}
          HERE: ${{ github.repository }}
        run: |
          set -euo pipefail
          portals="$RUNNER_TEMP/docs-projects.tsv"
          # Every repository with the property and a Pages site: owner/name, and the name to show.
          gh api --paginate "orgs/$ORG/repos?per_page=100" \
            --jq '.[] | select(.has_pages and (.archived | not) and ((.custom_properties["beplus-docs-project"] // "") != ""))
                  | [.full_name, .custom_properties["beplus-docs-project"]] | @tsv' > "$portals"

          list='[]'
          while IFS=$'\t' read -r repo name; do
            if href=$(gh api "repos/$repo/pages" --jq '.html_url' 2>/dev/null) && [ -n "$href" ]; then
              list=$(jq -c --arg repo "$repo" --arg name "$name" --arg href "${href%/}" \
                '. + [{ repo: $repo, name: $name, href: $href }]' <<< "$list")
            else
              echo "::warning title=Project switcher::$repo has beplus-docs-project set, but Pages does not say where its site is served, so the switcher leaves it out."
            fi
          done < "$portals"

          count=$(jq 'length' <<< "$list")
          if [ "$count" -eq 0 ]; then
            echo "::warning title=Project switcher::No repository in $ORG has beplus-docs-project set, so the switcher lists the engine's own projects."
            exit 0
          fi
          echo "DOCS_PROJECTS=$list" >> "$GITHUB_ENV"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if ! jq -e --arg here "$HERE" 'any(.[]; (.repo | ascii_downcase) == ($here | ascii_downcase))' <<< "$list" > /dev/null; then
            echo "::warning title=Project switcher::$HERE is not in the switcher: set its beplus-docs-project property to the name to show, e.g. @beplus/<project>."
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
          jq -r '.[] | "\(.name)\t\(.href)"' <<< "$list"

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - uses: beplus/setup-beplus/cli@v2
        env:
          BE_NPM_TARGET: ${{ vars.BE_NPM_TARGET }}
          BE_NPM_TOKEN: ${{ secrets.BE_NPM_TOKEN }}
        with:
          BE_CLI_VERSION: ${{ vars.BE_CLI_VERSION || 'latest' }}
          BE_NPM_AUTH: true

      - name: Install dependencies
        run: node common/scripts/install-run-rush.js install

      - name: Build what the site reads
        if: inputs.prebuild != ''
        run: ${{ inputs.prebuild }}

      - name: Test
        if: inputs.test != ''
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.test }}

      - name: Build the site
        working-directory: ${{ inputs.working-directory }}
        env:
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: ${{ inputs.build }}

      - name: Summarise what was built
        env:
          OUT: ${{ inputs.working-directory }}/${{ inputs.output }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          TITLE: ${{ inputs.title }}
          PROJECTS: ${{ steps.projects.outputs.count }}
          MISSING: ${{ steps.projects.outputs.missing }}
          HERE: ${{ github.repository }}
        run: |
          {
            echo "### $TITLE"
            echo
            echo "- **Pages**: $(find "$OUT" -name index.html | wc -l)"
            echo "- **Size**: $(du -sh "$OUT" | cut -f1)"
            echo "- **Served at**: ${SITE_URL:-not published — this run builds at the root}"
            if [ -n "$PROJECTS" ]; then
              echo "- **Project switcher**: $PROJECTS projects, from GitHub"
            else
              echo "- **Project switcher**: the engine's own list — GitHub was not asked, or did not answer"
            fi
            if [ "$MISSING" = "true" ]; then
              echo "- **Not in the switcher**: $HERE has no \`beplus-docs-project\` property"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the site
        if: steps.publish.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ inputs.working-directory }}/${{ inputs.output }}

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # Pages needs to write the deployment and to mint the token that proves it came from this run.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
