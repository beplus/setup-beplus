# The `cli` action installs the beplus CLI the repository pins.
# ---------------------------------------------------------------
# A CLI release must never change what a repository's CI does without a commit in
# that repository. So `cli` (and `cdk-package`, which calls it) installs the
# version pinned in the nearest beplus.estate.json → cli.version via `be auto`,
# and checks `beplus --version` against the pin before anything uses the CLI.
#
# Each leg runs THIS branch's action (`uses: ./cli`) on a fresh runner against a
# fixture under test/cli, and asserts what `beplus --version` reports. The pinned
# fixture pins 2.10.0 — not the newest release — so a run that floated on
# `be latest` instead of honouring the pin cannot pass by accident.
#
# `be` itself comes from beplus/be@main, so the pinned legs go green once
# `be auto` reads beplus.estate.json there.
#
# BE_NPM_CHECK: with no token the auth is skipped and npm.beplus.cloud answers
# the @beplus read with HTTP 200 and its stub body, so the check must fail the
# run — before any install would have.
#
# BE_PLUGINS (the `plugins` job): a spec that is not <package>@<exact version>
# fails the run before anything is installed, and a pinned plugin is installed
# from npm.beplus.cloud and loaded at exactly its version. That leg needs a
# token: the repository secret BE_NPM_TOKEN (prod's, where the plugins are
# released), with the variable BE_NPM_TARGET (beplus.cloud).
name: Test cli

on:
  pull_request:
    paths:
      - cli/**
      - cdk-package/**
      - test/cli/**
      - .github/workflows/test-cli.yml
  push:
    branches: [main]
    paths:
      - cli/**
      - cdk-package/**
      - test/cli/**
      - .github/workflows/test-cli.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: a pin installs exactly the pinned version
            dir: test/cli/pinned
            expect: 2.10.0
          - case: the nearest manifest pins a package below it
            dir: test/cli/pinned/packages/app
            expect: 2.10.0
          - case: BE_CLI_VERSION wins over the pin
            dir: test/cli/pinned
            version: 2.9.0
            expect: 2.9.0
          - case: a manifest without a pin floats on latest
            dir: test/cli/unpinned
            expect: latest
          - case: no manifest floats on latest
            dir: ""
            expect: latest
          - case: an inexact pin fails the run
            dir: test/cli/inexact
            expect: failure
          - case: the registry check fails on the anonymous stub
            dir: test/cli/pinned
            npm-check: test/cli/npm-check
            expect: failure

    steps:
      - uses: actions/checkout@v4

      # A package directory with no manifest of its own: `be auto` must walk up
      # to test/cli/pinned, the way it does from packages/apps/* in an estate.
      - name: Make a package directory below the pinned manifest
        run: mkdir -p test/cli/pinned/packages/app

      # The scope mapped, no token: what a job that BE_NPM_TOKEN never reached sees.
      - name: Map @beplus without a token
        if: ${{ matrix.npm-check }}
        run: echo "@beplus:registry=https://npm.beplus.cloud/" >> ~/.npmrc

      - name: Setup beplus CLI
        id: setup
        uses: ./cli
        continue-on-error: ${{ matrix.expect == 'failure' }}
        with:
          BE_CLI_VERSION: ${{ matrix.version }}
          # Empty `dir` = a directory with no beplus.estate.json at or above it.
          BE_WORKING_DIRECTORY: ${{ matrix.dir || runner.temp }}
          BE_NPM_AUTH: ${{ matrix.npm-check && 'true' || 'false' }}
          BE_NPM_CHECK: ${{ matrix.npm-check }}

      - name: Assert the installed version
        shell: bash
        env:
          CASE: ${{ matrix.case }}
          EXPECT: ${{ matrix.expect }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          set -euo pipefail

          if [[ "$EXPECT" == failure ]]; then
            if [[ "$OUTCOME" != failure ]]; then
              echo "::error::The action did not fail — $CASE (outcome: $OUTCOME)."
              exit 1
            fi
            echo "The action failed, as it must: $CASE."
            exit 0
          fi

          if [[ "$EXPECT" == latest ]]; then
            EXPECT="$(be --latest)"
            EXPECT="${EXPECT#v}"
          fi

          out="$(beplus --version)"
          echo "$out"
          installed=""
          if [[ "$out" =~ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?) ]]; then
            installed="${BASH_REMATCH[1]}"
          fi
          if [[ "$installed" != "$EXPECT" ]]; then
            echo "::error::beplus --version reports ${installed:-nothing}, expected $EXPECT."
            exit 1
          fi
          echo "beplus CLI $installed, as expected."

  plugins:
    name: ${{ matrix.case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: a plugin range fails the run
            plugins: "@beplus/cli-plugin-electron@^0.1.0"
            expect: failure
          - case: a plugin tag fails the run
            plugins: "@beplus/cli-plugin-electron@latest"
            expect: failure
          - case: a plugin without a version fails the run
            plugins: "@beplus/cli-plugin-electron"
            expect: failure
          - case: a pinned plugin is installed at exactly its version
            plugins: "@beplus/cli-plugin-electron@0.1.0-next.1"
            expect: installed

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22.14

      - name: The token a real install needs
        if: ${{ matrix.expect == 'installed' }}
        env:
          BE_NPM_TOKEN: ${{ secrets.BE_NPM_TOKEN }}
        run: |
          if [ -z "$BE_NPM_TOKEN" ]; then
            echo "::error::This leg installs from npm.beplus.cloud and needs the repository secret BE_NPM_TOKEN (prod's token, where the plugins are released) and the variable BE_NPM_TARGET=beplus.cloud."
            exit 1
          fi

      - name: Setup beplus CLI with plugins
        id: setup
        uses: ./cli
        continue-on-error: ${{ matrix.expect == 'failure' }}
        env:
          BE_NPM_TARGET: ${{ vars.BE_NPM_TARGET || 'beplus.cloud' }}
          BE_NPM_TOKEN: ${{ secrets.BE_NPM_TOKEN }}
        with:
          # The plugin's @beplus/cli-sdk peer range wants a CLI from 2.35 on.
          BE_CLI_VERSION: 2.40.1
          BE_WORKING_DIRECTORY: ${{ runner.temp }}
          BE_NPM_AUTH: ${{ matrix.expect == 'installed' && 'true' || 'false' }}
          BE_PLUGINS: ${{ matrix.plugins }}

      - name: Assert the outcome
        shell: bash
        env:
          CASE: ${{ matrix.case }}
          EXPECT: ${{ matrix.expect }}
          OUTCOME: ${{ steps.setup.outcome }}
        run: |
          set -euo pipefail
          if [[ "$EXPECT" == failure ]]; then
            if [[ "$OUTCOME" != failure ]]; then
              echo "::error::The action did not fail — $CASE (outcome: $OUTCOME)."
              exit 1
            fi
            if beplus plugin list --json | jq -e '.data.plugins[] | select(.namespace == "electron")' > /dev/null; then
              echo "::error::The action failed, but installed the plugin anyway — $CASE."
              exit 1
            fi
            echo "The action failed and installed nothing, as it must: $CASE."
            exit 0
          fi
          # The plugin's commands run: the files its icons command would write.
          beplus electron icons --dry-run --json --path "$RUNNER_TEMP" | jq -e '.success == true and (.data.files | length) > 0'
          echo "beplus electron runs: $CASE."
