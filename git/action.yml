name: "Setup beplus Git"
description: "Configure Git for the GitHub Actions runner"
inputs:
  BE_RELEASE_GITHUB_APP_ID:
    description: "GitHub App ID"
    required: true
  BE_RELEASE_GITHUB_APP_PRIVATE_KEY:
    description: "GitHub App private key"
    required: true
  BE_RELEASE_GITHUB_APP_NAME:
    description: "Deprecated: commits are authored as GIT_USER_NAME, not as the App"
    required: false
    default: "beplus-release-bot"
  GIT_USER_NAME:
    description: "Who CI's commits are authored by"
    required: false
    default: "bea"
  GIT_USER_EMAIL:
    description: "Their email"
    required: false
    default: "bea@be.plus"

runs:
  using: "composite"
  steps:
    - name: Generate GitHub App Token
      uses: actions/create-github-app-token@v1
      id: app-token
      with:
        app-id: ${{ inputs.BE_RELEASE_GITHUB_APP_ID }}
        private-key: ${{ inputs.BE_RELEASE_GITHUB_APP_PRIVATE_KEY }}

    - name: Configure Git
      shell: bash
      env:
        GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
      run: |
        git config user.name "${{ inputs.GIT_USER_NAME }}"
        git config user.email "${{ inputs.GIT_USER_EMAIL }}"
        # actions/checkout leaves GITHUB_TOKEN in an extraheader, and git sends that before it ever
        # asks a credential helper — so without this the push goes out as github-actions[bot], which
        # the org rulesets do not let through. The release App is the only CI identity they bypass.
        git config --local --unset-all "http.https://github.com/.extraheader" || true
        git config --global credential.helper store
        echo "https://x-access-token:${GITHUB_APP_TOKEN}@github.com" > ~/.git-credentials
