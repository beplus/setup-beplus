name: "Setup beplus CLI"
description: "Install and verify the beplus CLI the repository pins (beplus.estate.json → cli.version) + authenticate npm for beplus.cloud packages"
inputs:
  BE_CLI_VERSION:
    description: >-
      Version of beplus CLI to install, passed to `be` (e.g. 2.11.0, 2, latest).
      Empty (the default) installs the version the repository pins in the nearest
      beplus.estate.json → cli.version, via `be auto`; a repository without a pin
      gets `latest`, with a warning that it floats. A value here wins over the pin.
    required: false
    default: ""
  BE_NPM_AUTH:
    description: "Authenticate beplus.cloud NPM? (requires BE_NPM_TARGET and BE_NPM_TOKEN env vars)"
    required: false
    default: "false"
  BE_NPM_CHECK:
    description: >-
      Package directories (space- or newline-separated, relative to the workspace)
      whose @beplus dependencies must come back from the registry as real packages
      after `beplus npm auth`. npm.beplus.cloud answers a read it cannot
      authenticate with HTTP 200 and a stub body — never 401 — so without this a
      token that did not reach the job fails nothing until pnpm, minutes later,
      reports ERR_PNPM_TARBALL_INTEGRITY. Needs npm and jq. Empty (the default):
      no check.
    required: false
    default: ""
  BE_PREFIX:
    description: "Install prefix for beplus binaries (must be writable)."
    required: false
  BE_WORKING_DIRECTORY:
    description: >-
      Where the pin is looked up: the nearest beplus.estate.json at or above this
      directory, exactly as `be auto` finds it. Relative to the workspace.
      Default: the workspace (check the repository out first).
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install @beplus/be
      shell: bash
      env:
        BE_PREFIX: ${{ inputs.BE_PREFIX }}
      run: |
        set -euo pipefail
        curl -fsSL "https://raw.githubusercontent.com/beplus/be/main/scripts/install.sh" | bash -s -- --ci

    - name: Export BE_PREFIX + PATH for GitHub Actions
      shell: bash
      run: |
        set -euo pipefail
        BE_PREFIX="${BE_PREFIX:-$HOME/.beplus}"
        echo "BE_PREFIX=$BE_PREFIX" >> "$GITHUB_ENV"
        echo "$BE_PREFIX/bin" >> "$GITHUB_PATH"

    # Which CLI this run gets. A CLI release must never change what a repository's
    # CI does without a commit in that repository, so the version comes from the
    # pin the repository commits — not from whatever was released this morning.
    #
    # This step only decides WHETHER there is a pin. Resolving and validating it
    # is `be auto`'s job (one implementation, the same one a laptop and a Docker
    # build run); the pin read here is kept to prove, after the install, that
    # `be auto` installed exactly it.
    - name: Choose the beplus CLI version
      id: choose
      shell: bash
      working-directory: ${{ inputs.BE_WORKING_DIRECTORY || github.workspace }}
      env:
        INPUT_VERSION: ${{ inputs.BE_CLI_VERSION }}
      run: |
        set -euo pipefail

        # The nearest beplus.estate.json at or above this directory — the same
        # walk `be auto` does.
        manifest=""
        dir="$PWD"
        while :; do
          if [[ -e "$dir/beplus.estate.json" ]]; then
            manifest="$dir/beplus.estate.json"
            break
          fi
          [[ "$dir" == "/" || -z "$dir" ]] && break
          dir="$(dirname "$dir")"
        done
        # Annotations point at the file relative to the repository when they can.
        file="${manifest#"$GITHUB_WORKSPACE"/}"

        pin=""
        if [[ -n "$manifest" ]]; then
          command -v jq > /dev/null || { echo "::error::jq is required to read the beplus CLI pin from $manifest."; exit 1; }
          # A manifest that cannot be read is not "no pin": fail, never float.
          if ! pin="$(jq -r '.cli.version // empty' "$manifest")"; then
            echo "::error file=$file::Cannot read cli.version from $manifest (invalid JSON, or \"cli\" is not an object)."
            exit 1
          fi
          if [[ "$pin" =~ [[:space:]] ]]; then
            echo "::error file=$file::cli.version in $manifest is not a version: \"$pin\"."
            exit 1
          fi
        fi

        version="$INPUT_VERSION"
        floating=""
        if [[ -n "$INPUT_VERSION" ]]; then
          if [[ -n "$pin" && "${INPUT_VERSION#v}" != "${pin#v}" ]]; then
            echo "::warning file=$file::BE_CLI_VERSION=$INPUT_VERSION overrides the beplus CLI $pin pinned in $manifest."
          fi
          pin=""
          echo "Installing beplus CLI $INPUT_VERSION (BE_CLI_VERSION)."
        elif [[ -n "$pin" ]]; then
          version="auto"
          echo "Installing beplus CLI $pin, pinned in $manifest (be auto)."
        else
          # Today's behaviour, said out loud.
          version="latest"
          floating="${manifest:-no beplus.estate.json at or above $PWD}"
          echo "No beplus CLI pin ($floating): installing latest."
        fi

        {
          echo "version=$version"
          echo "pin=$pin"
          echo "manifest=$manifest"
          echo "floating=$floating"
        } >> "$GITHUB_OUTPUT"

    - name: Install beplus CLI
      shell: bash
      working-directory: ${{ inputs.BE_WORKING_DIRECTORY || github.workspace }}
      env:
        VERSION: ${{ steps.choose.outputs.version }}
      run: |
        set -euo pipefail
        be "$VERSION"

    - name: Verify beplus CLI version
      shell: bash
      env:
        PIN: ${{ steps.choose.outputs.pin }}
        MANIFEST: ${{ steps.choose.outputs.manifest }}
        FLOATING: ${{ steps.choose.outputs.floating }}
      run: |
        set -euo pipefail
        out="$(beplus --version)"
        echo "beplus CLI version:"
        echo "$out"

        installed=""
        if [[ "$out" =~ ([0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?) ]]; then
          installed="${BASH_REMATCH[1]}"
        fi
        file="${MANIFEST#"$GITHUB_WORKSPACE"/}"

        # A pinned run installs the pin or fails — never "something close to it".
        if [[ -n "$PIN" && "$installed" != "${PIN#v}" ]]; then
          echo "::error file=$file::$MANIFEST pins beplus CLI $PIN, but \`be auto\` installed ${installed:-an unknown version}."
          exit 1
        fi

        if [[ -n "$FLOATING" ]]; then
          echo "::warning${MANIFEST:+ file=$file}::This repository does not pin the beplus CLI ($FLOATING), so its CI floats on \`be latest\` — every CLI release changes it without a commit here. Pin it: add \"cli\": { \"version\": \"${installed:-x.y.z}\" } to beplus.estate.json."
        fi

    - name: beplus npm auth
      if: ${{ inputs.BE_NPM_AUTH == 'true'}}
      shell: bash
      run: |
        set -euo pipefail

        if [[ -n "${BE_NPM_TARGET:-}" ]] && \
           [[ -n "${BE_NPM_TOKEN:-}" ]]; then
          beplus npm auth
        else
          echo "Skipping beplus npm auth (BE_NPM_AUTH=${{ inputs.BE_NPM_AUTH }} because one of (BE_NPM_TARGET,BE_NPM_TOKEN) is missing."
        fi

    # ⚠️ THE REGISTRY NEVER SAYS NO. npm.beplus.cloud answers a read it cannot
    # authenticate with HTTP 200 and a stub body — {"status":200,"message":"OK"}
    # — never 401, and the step above skips the auth (saying so in its log) when
    # BE_NPM_TARGET or BE_NPM_TOKEN did not reach the job. `npm view` then prints
    # nothing and exits 0; pnpm fails minutes later with ERR_PNPM_TARBALL_INTEGRITY,
    # then ERR_PNPM_NO_VERSIONS. So ask, through the registry the install will use,
    # for every @beplus package the named packages depend on, and fail here,
    # naming the cause.
    - name: Check the @beplus registry serves real packages
      if: ${{ inputs.BE_NPM_CHECK != '' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        CHECK: ${{ inputs.BE_NPM_CHECK }}
      run: |
        set -euo pipefail
        command -v npm > /dev/null || { echo "::error::BE_NPM_CHECK needs npm on PATH (actions/setup-node first)."; exit 1; }
        command -v jq > /dev/null || { echo "::error::BE_NPM_CHECK needs jq on PATH."; exit 1; }

        # The registry Rush hands pnpm for the scope; else npm's own (~/.npmrc,
        # which `beplus npm auth` wrote).
        registry="$(sed -n 's/^[[:space:]]*@beplus:registry[[:space:]]*=[[:space:]]*//p' common/config/rush/.npmrc 2> /dev/null | tail -n 1 | tr -d '[:space:]')" || registry=""
        scope=()
        if [[ "$registry" =~ ^https?://[^[:space:]\$]+$ ]]; then
          scope=("--@beplus:registry=$registry")
        else
          registry="$(npm config get @beplus:registry)"
          [ "$registry" != undefined ] || registry="npm's default registry (nothing maps @beplus)"
        fi

        # Each package's direct @beplus dependencies. A workspace project is
        # built, not fetched.
        deps=""
        for dir in $CHECK; do
          if [ ! -f "$dir/package.json" ]; then
            echo "::error::BE_NPM_CHECK: $dir has no package.json."
            exit 1
          fi
          deps+="$(jq -r '
            [.dependencies, .devDependencies, .optionalDependencies]
            | map(objects | to_entries[]) | .[]
            | select((.key | startswith("@beplus/")) and ((.value | tostring) | startswith("workspace:") | not))
            | .key' "$dir/package.json")"$'\n'
        done
        mapfile -t wanted < <(printf '%s' "$deps" | sed '/^$/d' | sort -u)
        if [ "${#wanted[@]}" -eq 0 ]; then
          echo "Nothing in @beplus to check ($CHECK)."
          exit 0
        fi

        failed=0
        for pkg in "${wanted[@]}"; do
          err="$(mktemp)"
          rc=0
          name="$(npm view "$pkg" name "${scope[@]}" 2> "$err")" || rc=$?
          if [ "$rc" -eq 0 ] && [ "$name" = "$pkg" ]; then
            echo "✓ $pkg — a real package on $registry"
          elif [ "$rc" -ne 0 ]; then
            failed=1
            echo "::error::$pkg: $(grep -m 1 -E '^npm (error|ERR!) [0-9]{3} ' "$err" || grep -m 1 -E '^npm (error|ERR!)' "$err" || head -n 1 "$err")"
          else
            failed=1
            echo "::error::$pkg: $registry answered with its anonymous stub (HTTP 200, no package). BE_NPM_TOKEN did not reach this job, or the registry refused it — a repository or organization secret reaches it; an environment secret only reaches a job that claims that environment."
          fi
          rm -f "$err"
        done
        exit "$failed"
